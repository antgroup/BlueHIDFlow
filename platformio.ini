; PlatformIO Project Configuration File
;
; BlueHIDFlow - BLE HID Mobile Automation Tool
; https://github.com/antgroup/BlueHIDFlow
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_flags =
	-std=gnu++14
	; ARDUINO_USB_CDC_ON_BOOT: 0=使用 UART0 串口（默认，需 USB-TTL 转串口下载器）
	;                          1=使用 ESP32-S3 原生 USB CDC（直接 USB 口下载/监控）
	; 若你的板子是带 USB 口的官方 DevKit，改为 1 更方便。
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DMQTT_MAX_PACKET_SIZE=32768
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
	-DCONFIG_SPIRAM_CACHE_WORKAROUND=1
	-Iinclude
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.ulp_driver = disabled
; upload_port: 烧录串口设备名。请根据自己的系统和下载器调整：
;   macOS:   /dev/cu.usbserial-XXXX (USB-TTL) 或 /dev/cu.usbmodemXXXX (原生 USB)
;   Linux:   /dev/ttyUSB0 或 /dev/ttyACM0
;   Windows: COM3 / COM4 等
; 留空则 PlatformIO 自动检测；显式指定可避免多设备时识别错误。
upload_port = 
upload_speed = 460800
upload_protocol = esptool
lib_deps =
	knolleary/PubSubClient@2.8.0
	h2zero/NimBLE-Arduino@^2.3.8
	bblanchon/ArduinoJson@7.0.0
	espressif/esp32-camera @ ^2.0.0
	https://github.com/HijelHub/HijelHID_BLEKeyboard.git
	https://github.com/HijelHub/HijelHID_BLEMouse.git
extra_scripts =
